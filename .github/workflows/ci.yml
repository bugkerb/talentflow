name: CI
on: [push, pull_request]

concurrency:
  group: talentflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run auth and foundation E2E against local Supabase
        env:
          # Local-only fixture; never reused for hosted or production environments.
          E2E_HR_PASSWORD: demo-password-not-for-production
        run: npm run test:e2e
      - name: Secret scan
        run: |
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|OPENROUTER_API_KEY=sk-|SUPABASE_SERVICE_ROLE_KEY=(eyJ|sb_secret))' -- ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo "Potential secret detected"
            exit 1
          fi
