name: CI
on:
  push:
    paths:
      - "src/**"
      - "app/**"
      - "components/**"
      - "public/**"
      - "tests/unit/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "vitest.config.*"
      - "eslint.config.*"
      - ".eslintrc*"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "app/**"
      - "components/**"
      - "public/**"
      - "tests/unit/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.*"
      - "vitest.config.*"
      - "eslint.config.*"
      - ".eslintrc*"
      - ".github/workflows/ci.yml"

concurrency:
  group: talentflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Secret scan
        run: |
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|OPENROUTER_API_KEY=sk-|SUPABASE_SERVICE_ROLE_KEY=(eyJ|sb_secret))' -- ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo "Potential secret detected"
            exit 1
          fi
